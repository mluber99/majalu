<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAJALU – Tier-Memory</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --green: #4d915e;
  --dark: #27323a;
  --cream: #fff8e7;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--dark);
  background:
    linear-gradient(
      180deg,
      #dff4ff 0%,
      #eff9f4 45%,
      #fff8e8 100%
    );
}

.app {
  width: min(94%, 720px);
  margin: auto;
  padding: 38px 10px 50px;
  text-align: center;
}

h1 {
  color: #3f8755;
  font-size: clamp(42px, 10vw, 64px);
  letter-spacing: 7px;
  margin: 5px 0 4px;
}

.subtitle {
  font-size: clamp(19px, 5vw, 28px);
  font-weight: 800;
  margin-bottom: 28px;
}

.levels {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  margin-bottom: 24px;
}

.level {
  border: 0;
  background: white;
  color: var(--dark);
  border-radius: 40px;
  padding: 16px 25px;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 14px rgba(0,0,0,.06);
}

.level.active {
  background: var(--green);
  color: white;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-bottom: 25px;
}

.stat,
.restart {
  min-width: 145px;
  padding: 13px 18px;
  border-radius: 30px;
  background: rgba(255,255,255,.9);
  font-size: 18px;
  font-weight: 800;
}

.restart {
  border: 0;
  color: var(--dark);
  cursor: pointer;
}

.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  width: 100%;
  margin: 10px auto 0;
}

/* KARTE */

.card {
  position: relative;
  aspect-ratio: 1 / 1;
  cursor: pointer;
  perspective: 900px;
  user-select: none;
}

.card-inner {
  position: absolute;
  inset: 0;
  transition: transform .5s ease;
  transform-style: preserve-3d;
}

.card.flipped .card-inner,
.card.matched .card-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 18px;

  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;

  box-shadow: 0 5px 14px rgba(0,0,0,.12);
}

.card-back {
  background: var(--green);
  color: white;
  font-weight: 900;
  letter-spacing: 1px;
  font-size: clamp(12px, 3vw, 18px);
}

.card-front {
  background: white;
  transform: rotateY(180deg);
  flex-direction: column;
}

.animal {
  font-size: clamp(34px, 10vw, 64px);
  line-height: 1;
}

.animal-name {
  margin-top: 6px;
  font-size: clamp(11px, 3vw, 17px);
  font-weight: 800;
}

.card.matched .card-front {
  outline: 4px solid #76b985;
}

.win {
  display: none;
  margin: 28px 0 5px;
  padding: 22px;
  background: white;
  border-radius: 25px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
}

.win.show {
  display: block;
}

.win-title {
  font-size: 28px;
  font-weight: 900;
  color: var(--green);
}

.win button {
  margin-top: 15px;
  border: 0;
  border-radius: 30px;
  padding: 14px 25px;
  background: var(--green);
  color: white;
  font-size: 18px;
  font-weight: 800;
}

.footer {
  margin-top: 35px;
  font-size: 14px;
  opacity: .7;
}

/* kleinere Smartphones */

@media (max-width: 420px) {

  .app {
    width: 96%;
    padding-left: 6px;
    padding-right: 6px;
  }

  .board {
    gap: 8px;
  }

  .card-face {
    border-radius: 13px;
  }

  .level {
    padding: 13px 17px;
    font-size: 16px;
  }

  .stat,
  .restart {
    min-width: 135px;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<main class="app">

<h1>MAJALU</h1>

<div class="subtitle">
🐾 Tier-Memory für kleine Entdecker
</div>

<div class="levels">

<button class="level" data-pairs="6">
Leicht · 6 Paare
</button>

<button class="level active" data-pairs="8">
Mittel · 8 Paare
</button>

<button class="level" data-pairs="12">
Groß · 12 Paare
</button>

</div>


<div class="stats">

<div class="stat">
🎯 Züge:
<span id="moves">0</span>
</div>

<div class="stat">
⭐ Paare:
<span id="matches">0</span>/<span id="total">8</span>
</div>

<div class="stat">
⏱️ <span id="timer">00:00</span>
</div>

<button class="restart" id="restart">
↻ Neu mischen
</button>

</div>


<div id="board" class="board"></div>


<div id="win" class="win">

<div class="win-title">
🎉 Super gemacht!
</div>

<p>
Du hast alle Tierpaare gefunden.
</p>

<div id="result"></div>

<button id="again">
Noch einmal spielen
</button>

</div>


<div class="footer">
MAJALU · Tier-Memory
</div>

</main>


<script>

const animals = [
  ["🐶","Hund"],
  ["🐱","Katze"],
  ["🐰","Hase"],
  ["🦊","Fuchs"],
  ["🐻","Bär"],
  ["🐼","Panda"],
  ["🐨","Koala"],
  ["🐯","Tiger"],
  ["🦁","Löwe"],
  ["🐸","Frosch"],
  ["🐵","Affe"],
  ["🐮","Kuh"]
];

const board = document.getElementById("board");
const movesEl = document.getElementById("moves");
const matchesEl = document.getElementById("matches");
const totalEl = document.getElementById("total");
const timerEl = document.getElementById("timer");
const winEl = document.getElementById("win");
const resultEl = document.getElementById("result");

let pairCount = 8;
let firstCard = null;
let secondCard = null;
let locked = false;

let moves = 0;
let matches = 0;

let seconds = 0;
let timerInterval = null;
let timerStarted = false;


/* Mischen */

function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] =
    [array[j], array[i]];
  }

  return array;
}


/* Spiel erzeugen */

function newGame() {

  clearInterval(timerInterval);

  timerInterval = null;
  timerStarted = false;

  seconds = 0;
  moves = 0;
  matches = 0;

  firstCard = null;
  secondCard = null;
  locked = false;

  movesEl.textContent = "0";
  matchesEl.textContent = "0";
  totalEl.textContent = pairCount;
  timerEl.textContent = "00:00";

  winEl.classList.remove("show");

  board.innerHTML = "";

  const selected =
    animals.slice(0, pairCount);

  let deck = [];

  selected.forEach((animal, index) => {

    deck.push({
      id: index,
      emoji: animal[0],
      name: animal[1]
    });

    deck.push({
      id: index,
      emoji: animal[0],
      name: animal[1]
    });

  });

  shuffle(deck);

  deck.forEach(animal => {

    const card =
      document.createElement("div");

    card.className = "card";
    card.dataset.id = animal.id;

    card.innerHTML = `
      <div class="card-inner">

        <div class="card-face card-back">
          MAJALU
        </div>

        <div class="card-face card-front">

          <div class="animal">
            ${animal.emoji}
          </div>

          <div class="animal-name">
            ${animal.name}
          </div>

        </div>

      </div>
    `;

    card.addEventListener(
      "click",
      () => flipCard(card)
    );

    board.appendChild(card);

  });

}


/* Karte umdrehen */

function flipCard(card) {

  if (locked) return;

  if (card === firstCard) return;

  if (card.classList.contains("matched"))
    return;

  startTimer();

  card.classList.add("flipped");

  if (!firstCard) {

    firstCard = card;
    return;

  }

  secondCard = card;
  locked = true;

  moves++;

  movesEl.textContent = moves;

  checkCards();
}


/* Karten vergleichen */

function checkCards() {

  const same =
    firstCard.dataset.id ===
    secondCard.dataset.id;

  if (same) {

    firstCard.classList.add("matched");
    secondCard.classList.add("matched");

    matches++;

    matchesEl.textContent = matches;

    resetTurn();

    if (matches === pairCount) {

      clearInterval(timerInterval);

      setTimeout(showWin, 500);
    }

  } else {

    setTimeout(() => {

      firstCard.classList.remove("flipped");
      secondCard.classList.remove("flipped");

      resetTurn();

    }, 900);

  }

}


/* Zug zurücksetzen */

function resetTurn() {

  firstCard = null;
  secondCard = null;
  locked = false;

}


/* Timer */

function startTimer() {

  if (timerStarted) return;

  timerStarted = true;

  timerInterval =
    setInterval(() => {

      seconds++;

      const min =
        String(
          Math.floor(seconds / 60)
        ).padStart(2,"0");

      const sec =
        String(
          seconds % 60
        ).padStart(2,"0");

      timerEl.textContent =
        min + ":" + sec;

    },1000);
}


/* Gewonnen */

function showWin() {

  resultEl.innerHTML =
    "🎯 " + moves +
    " Züge &nbsp; · &nbsp; ⏱️ " +
    timerEl.textContent;

  winEl.classList.add("show");

  winEl.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* Schwierigkeitsstufen */

document
.querySelectorAll(".level")
.forEach(button => {

  button.addEventListener(
    "click",
    function() {

      document
      .querySelectorAll(".level")
      .forEach(b =>
        b.classList.remove("active")
      );

      this.classList.add("active");

      pairCount =
        Number(this.dataset.pairs);

      newGame();

    }
  );

});


/* Neustart */

document
.getElementById("restart")
.addEventListener(
  "click",
  newGame
);


/* Noch einmal */

document
.getElementById("again")
.addEventListener(
  "click",
  newGame
);


/* Start */

newGame();

</script>

</body>
</html>
