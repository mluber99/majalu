<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luber's – Tier-Memory</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#29323a;background:linear-gradient(#e3f7ff,#fff9e8);min-height:100vh}.app{max-width:820px;margin:auto;padding:20px 12px 40px;text-align:center}h1{margin:0;color:#438b59;letter-spacing:6px;font-size:clamp(38px,8vw,62px)}.sub{font-weight:800;font-size:clamp(18px,4vw,27px);margin-bottom:20px}.controls,.stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.btn,.pill{border:0;border-radius:28px;padding:14px 20px;background:#fff;font-weight:800;font-size:clamp(15px,3.5vw,21px)}.btn{cursor:pointer}.active,.save{background:#4d965f;color:#fff}.stats{margin:20px 0}.board{display:grid;gap:10px;margin:10px auto 30px}.card{aspect-ratio:1;border:0;background:none;padding:0;perspective:600px}.inner{display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.3s}.open .inner,.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:17px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;box-shadow:0 5px 13px #0002}.back{background:#4d965f;color:#fff;font-weight:900;letter-spacing:2px;font-size:clamp(10px,2.3vw,18px)}.front{background:#fff;transform:rotateY(180deg);flex-direction:column}.animal{font-size:clamp(25px,7vw,55px)}.name{font-weight:800;font-size:clamp(8px,2vw,16px)}.matched .front{outline:4px solid #79bd84}.leader{margin-top:25px}.rank-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}.rank-tab{border:2px solid #4d965f;border-radius:22px;padding:9px 15px;background:#fff;color:#365f42;font-weight:800;cursor:pointer}.rank-tab.active{background:#4d965f;color:#fff}table{width:100%;border-collapse:collapse;background:#fffd;border-radius:14px;overflow:hidden}th,td{padding:8px 4px;border-bottom:1px solid #ddd;font-size:clamp(11px,2.5vw,16px)}th{background:#4d965f;color:#fff}.small{font-size:13px;color:#667;margin-bottom:10px}.clear{border:0;background:none;text-decoration:underline;color:#667;margin-top:10px}.overlay{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px;z-index:5}.show{display:flex}.modal{background:#fff;border-radius:24px;padding:26px;max-width:430px;width:100%;z-index:7}.modal h2{font-size:34px;margin:0}.modal input{width:100%;font-size:20px;padding:12px;border:2px solid #aaa;border-radius:12px;margin:12px 0}.save{width:100%}.confetti{position:fixed;top:-30px;z-index:6;font-size:24px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}.new-score td{background:#e8f6e9;font-weight:800}
.new-score td:first-child{box-shadow:inset 5px 0 0 #4d965f}
.medal{font-size:clamp(18px,4vw,25px)}
.new-note{margin:10px 0 0;font-weight:800;color:#438b59}
footer{margin-top:28px;color:#667}@media(max-width:500px){.board.hard{gap:5px}.hard .face{border-radius:8px}.hard .animal{font-size:26px}.hard .name{font-size:8px}}
</style></head><body><main class="app"><h1>Luber's</h1><div class="sub">🐾 Tier-Memory für kleine Entdecker</div><div class="controls" id="levels"></div><div class="stats"><div class="pill">🎯 Züge: <span id="moves">0</span></div><div class="pill">⭐ Paare: <span id="pairs"></span></div><div class="pill">⏱️ <span id="time">00:00</span></div><button class="btn" id="shuffle">↻ Neu mischen</button></div><div id="board" class="board"></div><section class="leader"><h2>🏆 Luber's Bestenliste</h2><div class="small">Gemeinsame Online-Bestenliste · Rang nach Zeit, bei Gleichstand nach Zügen.</div><div class="rank-tabs" id="rankTabs"></div><div id="ranking"></div></section><footer>Luber's · Tier-Memory</footer></main><div class="overlay" id="win"><div class="modal"><h2>🎉 Geschafft!</h2><p id="result"></p><b>Dein Alias</b><input id="alias" maxlength="18" placeholder="z. B. Matze"><button class="btn save" id="save">Ergebnis speichern</button></div></div><script>
const animals=[{name:'Hund',icon:'🐶'},{name:'Katze',icon:'🐱'},{name:'Fuchs',icon:'🦊'},{name:'Löwe',icon:'🦁'},{name:'Elefant',icon:'🐘'},{name:'Giraffe',icon:'🦒'},{name:'Zebra',icon:'🦓'},{name:'Panda',icon:'🐼'},{name:'Affe',icon:'🐵'},{name:'Koala',icon:'🐨'},{name:'Eule',icon:'🦉'},{name:'Pinguin',icon:'🐧'},{name:'Bär',icon:'🐻'},{name:'Hase',icon:'🐰'},{name:'Kuh',icon:'🐮'},{name:'Schwein',icon:'🐷'},{name:'Schaf',icon:'🐑'},{name:'Pferd',icon:'🐴'}],levels=[["Leicht",6],["Mittel",8],["Groß",12],["Schwierig",18]];let count=8,rankCount=8,deck=[],first=null,lock=false,moves=0,found=0,start=null,timer=null,seconds=0,lastSaved=null;const $=s=>document.querySelector(s),fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"),key=()=>`majalu_scores_${count}`;
function levelsUI(){$("#levels").innerHTML=levels.map(([n,c])=>`<button class="btn ${c===count?"active":""}" data-c="${c}">${n} · ${c} Paare</button>`).join("");document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{count=+b.dataset.c;rankCount=count;levelsUI();rankTabsUI();game()})}
function rankTabsUI(){$("#rankTabs").innerHTML=[6,8,12,18].map(c=>`<button class="rank-tab ${c===rankCount?"active":""}" data-rank-c="${c}">${c} Paare</button>`).join("");document.querySelectorAll("[data-rank-c]").forEach(b=>b.onclick=()=>{rankCount=+b.dataset.rankC;rankTabsUI();rank()})}
function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function game(){clearInterval(timer);timer=null;start=null;seconds=moves=found=0;first=null;lock=false;$("#moves").textContent=0;$("#time").textContent="00:00";$("#pairs").textContent=`0/${count}`;deck=sh([...animals.slice(0,count),...animals.slice(0,count)]);draw();rank()}
function draw(){let b=$("#board");b.className="board"+(count===18?" hard":"");b.style.gridTemplateColumns=`repeat(${count===12||count===18?6:4},1fr)`;b.innerHTML=deck.map((a,i)=>`<button class="card" data-i="${i}"><span class="inner"><span class="face back">LUBER\'S</span><span class="face front"><span class="animal">${a.icon}</span><span class="name">${a.name}</span></span></span></button>`).join("");document.querySelectorAll(".card").forEach(c=>c.onclick=()=>flip(c))}
function flip(c){if(lock||c.classList.contains("open")||c.classList.contains("matched"))return;if(!start){start=Date.now();timer=setInterval(()=>$("#time").textContent=fmt(++seconds),1000)}c.classList.add("open");let i=+c.dataset.i;if(first===null){first={c,i};return}moves++;$("#moves").textContent=moves;let old=first;first=null;if(deck[old.i].name===deck[i].name){c.classList.add("matched");old.c.classList.add("matched");c.classList.remove("open");old.c.classList.remove("open");found++;$("#pairs").textContent=`${found}/${count}`;if(found===count)finish()}else{lock=true;setTimeout(()=>{c.classList.remove("open");old.c.classList.remove("open");lock=false},650)}}
function finish(){clearInterval(timer);seconds=Math.max(1,Math.round((Date.now()-start)/1000));$("#time").textContent=fmt(seconds);$("#result").innerHTML=`${count} Paare in <b>${fmt(seconds)}</b> mit <b>${moves} Zügen</b>.`;$("#win").classList.add("show");for(let i=0;i<60;i++){let e=document.createElement("span");e.className="confetti";e.textContent=["🎉","⭐","🐾","✨"][i%4];e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
const SUPABASE_URL="https://lkolmyscbbdcixrhsiqm.supabase.co";
const SUPABASE_KEY="sb_publishable_7bbur7lmwfJKwmVv1YWq-Q_HN-Gw9Ea";
const API=SUPABASE_URL+"/rest/v1/scores";
function esc(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}
async function rank(){
  $("#ranking").innerHTML="<p>Bestenliste wird geladen…</p>";
  try{
    const q=`?select=alias,difficulty,seconds,moves,created_at&difficulty=eq.${rankCount}&order=seconds.asc,moves.asc,created_at.asc&limit=10`;
    const r=await fetch(API+q,{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
    if(!r.ok) throw new Error(await r.text());
    const a=await r.json();
    const medals=["🥇","🥈","🥉"];
    let highlighted=false;
    const rows=a.map((x,i)=>{
      const isNew=!highlighted && lastSaved && rankCount===lastSaved.difficulty &&
        x.alias===lastSaved.alias && x.seconds===lastSaved.seconds && x.moves===lastSaved.moves &&
        Math.abs(new Date(x.created_at).getTime()-lastSaved.createdAt)<120000;
      if(isNew) highlighted=true;
      const place=i<3?`<span class="medal">${medals[i]}</span>`:(i+1);
      return `<tr class="${isNew?"new-score":""}"><td>${place}</td><td>${esc(x.alias)}</td><td>${new Date(x.created_at).toLocaleDateString("de-DE")}</td><td>${fmt(x.seconds)}</td><td>${x.moves}</td></tr>`;
    }).join("");
    $("#ranking").innerHTML=a.length?`<table><tr><th>Platz</th><th>Alias</th><th>Datum</th><th>Zeit</th><th>Züge</th></tr>${rows}</table>${highlighted?'<div class="new-note">⭐ Dein neues Ergebnis</div>':""}`:"<p>Noch kein Ergebnis gespeichert.</p>";
  }catch(e){console.error(e);$("#ranking").innerHTML="<p>⚠️ Bestenliste konnte nicht geladen werden.</p>"}
}
$("#save").onclick=async()=>{
  const alias=$("#alias").value.trim()||"Gast";
  const btn=$("#save");btn.disabled=true;btn.textContent="Wird gespeichert…";
  try{
    const r=await fetch(API,{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({alias,difficulty:count,seconds,moves})});
    if(!r.ok) throw new Error(await r.text());
    lastSaved={alias,difficulty:count,seconds,moves,createdAt:Date.now()};
    $("#win").classList.remove("show");$("#alias").value="";rankCount=count;rankTabsUI();await rank();
  }catch(e){console.error(e);alert("Das Ergebnis konnte nicht gespeichert werden. Bitte Internetverbindung prüfen.")}
  finally{btn.disabled=false;btn.textContent="Ergebnis speichern"}
};
$("#shuffle").onclick=game;
levelsUI();rankTabsUI();game();
</script></body></html>
